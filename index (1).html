<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта шума Москвы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: карта слева в рамке, справа панель с вариантами. На телефоне панель уходит под карту. */
:root {
  --bg: #eef0ec;
  --surface: #fbfbf8;
  --ink: #1b2320;
  --muted: #5b6762;
  --line: #d8ddd7;
  --track: #e3e7e1;
  --accent: #0e6b5b;
  --good: #1b7a4e;
  --good-soft: #e3f2ea;
  --sev-mid: #b86a00;
  --sev-high: #c4410f;
  --sev-crit: #a3141b;
  --pin-mid: #b86a00;
  --pin-high: #c4410f;
  --pin-crit: #a3141b;
  --font-display: 'Unbounded', 'Arial Black', sans-serif;
  --font-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #18201d; --ink: #e7ede9; --muted: #9aa7a1; --line: #2a3530;
    --track: #26302b; --accent: #4cc2a8; --good: #5ccf98; --good-soft: #17301f;
    --sev-mid: #f0a53a; --sev-high: #f4804d; --sev-crit: #ff6f66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #18201d; --ink: #e7ede9; --muted: #9aa7a1; --line: #2a3530;
  --track: #26302b; --accent: #4cc2a8; --good: #5ccf98; --good-soft: #17301f;
  --sev-mid: #f0a53a; --sev-high: #f4804d; --sev-crit: #ff6f66;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
  gap: 16px;
}

/* ---------- Карта ---------- */
.mapPane {
  position: relative;
  min-height: 0;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--track);
  overflow: hidden;
  container-type: size;
  display: grid;
  place-items: center;
}
.stage {
  position: relative;
  width: min(100cqw, calc(100cqh * 1.2304));
  aspect-ratio: 1303 / 1059;
  max-width: 100%;
  overflow: hidden;
  touch-action: pan-y;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.stage.zoomed { touch-action: none; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; --z: 1; }
.world.settle { transition: transform .22s ease; }
.world img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }

.zoomCtl {
  position: absolute; top: 10px; right: 10px; z-index: 5;
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(10, 20, 15, .25);
}
.zoomCtl button {
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 0; background: transparent; color: var(--ink); cursor: pointer;
  font-size: 22px; line-height: 1; padding: 0;
}
.zoomCtl button + button { border-top: 1px solid var(--line); }
.zoomCtl button:hover:not(:disabled) { background: var(--track); }
.zoomCtl button:disabled { color: var(--muted); opacity: .45; cursor: default; }
.zoomCtl button:focus-visible { outline: 3px solid #0b57d0; outline-offset: -3px; }
.zoomCtl svg { width: 18px; height: 18px; }

.pin {
  --pin: var(--pin-high);
  --s: 1;
  position: absolute;
  width: 30px; height: 30px;
  transform: translate(-50%, -50%) scale(calc(var(--s) / var(--z, 1)));
  border-radius: 50%;
  border: 1.5px solid #111;
  background: var(--pin);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  line-height: 1;
  letter-spacing: -0.02em;
  display: grid; place-items: center;
  padding: 0;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(10, 20, 15, .5);
}
.pin.sev-mid { --pin: var(--pin-mid); }
.pin.sev-high { --pin: var(--pin-high); }
.pin.sev-crit { --pin: var(--pin-crit); }
.pin::before {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  border: 2px solid var(--pin); opacity: 0;
  animation: pulse 2.6s ease-out infinite;
  animation-delay: var(--d, 0s);
  pointer-events: none;
}
.pin::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
.pin:hover { --s: 1.2; }
.pin[aria-pressed="true"] {
  --s: 1;
  z-index: 2;
  box-shadow: 0 0 0 2.5px #111, 0 1px 4px rgba(10, 20, 15, .5);
}
.pin[aria-pressed="true"]::before { animation: none; }
.pin:focus-visible { outline: 3px solid #0b57d0; outline-offset: 3px; }
@keyframes pulse {
  0% { transform: scale(.85); opacity: .75; }
  100% { transform: scale(1.7); opacity: 0; }
}

/* ---------- Панель ---------- */
.panel {
  min-height: 0; min-width: 0;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  display: flex; flex-direction: column;
  --sev: var(--sev-high);
}
.panel.sev-mid { --sev: var(--sev-mid); }
.panel.sev-high { --sev: var(--sev-high); }
.panel.sev-crit { --sev: var(--sev-crit); }

.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}
.brand { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .01em; }
.closeBtn {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
}
.closeBtn:hover { color: var(--ink); border-color: var(--muted); }
.closeBtn:focus-visible, .pin:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }

.content { flex: 1; display: flex; flex-direction: column; }
.empty {
  flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px;
  padding: 32px 24px;
}
.empty h2 {
  margin: 0; font-family: var(--font-display); font-weight: 500;
  font-size: 22px; line-height: 1.3; text-wrap: balance;
}
.legend { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px; }
.legend .lt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.mid { background: var(--sev-mid); } .dot.high { background: var(--sev-high); } .dot.crit { background: var(--sev-crit); }

.detail { padding: 18px; display: flex; flex-direction: column; gap: 18px; animation: fadein .22s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.chip {
  display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--sev); border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px;
}
.place h2 { margin: 10px 0 4px; font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.3; text-wrap: balance; }
.place p { margin: 0; color: var(--muted); }

.level { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
.levelTop { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.big { display: flex; align-items: baseline; gap: 6px; }
.big b { font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 1; color: var(--sev); font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: 14px; }
.big.sm b { font-size: 24px; color: var(--ink); }
.over { margin-left: auto; font-size: 13px; color: var(--sev); font-weight: 600; }

.scale { --norm: 30%; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--track); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--fill); background: var(--sev); border-radius: 4px 0 0 4px; }
.is-after .fill { background: var(--good); }
.cut {
  position: absolute; top: 0; bottom: 0; left: var(--cutL); width: var(--cutW);
  background: repeating-linear-gradient(135deg, var(--sev) 0 3px, transparent 3px 6px);
  opacity: .75; border-radius: 0 4px 4px 0;
}
.norm { position: absolute; left: var(--norm); top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .8; }
.ticks { position: relative; height: 16px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

.sol { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.sol.best { border: 1.5px solid var(--good); background: var(--good-soft); padding: 16px; }
.badge {
  align-self: flex-start; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--good); font-weight: 600;
}
.sol h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.sol.best h3 { font-family: var(--font-display); font-weight: 500; font-size: 17px; }
.sol p { margin: 0; color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
.stats dd.good { color: var(--good); }
.calc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.calc b { color: var(--ink); font-weight: 600; }
.sectionTitle { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.list { display: flex; flex-direction: column; gap: 10px; }

.foot { margin-top: auto; padding: 14px 18px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- Телефон ---------- */
@media (max-width: 859px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .mapPane { container-type: normal; display: block; }
  .stage { width: 100%; }
  .panel { overflow: visible; min-height: 340px; }
  .pin { width: 27px; height: 27px; font-size: 12px; }
  .empty { padding: 28px 20px; }
  .empty h2 { font-size: 20px; }
  .big b { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  .pin::before { animation: none; }
  .detail { animation: none; }
  .world.settle { transition: none; }
}
</style>

</head>

      day: 78, night: 71,
      solutions: [

        { name: 'Двойная полоса деревьев и кустарника', desc: 'Плотная посадка шириной около 12 м, снижает шум и пыль.', red: 3, cost: 500 * 9000, calc: '500 м × 9 тыс. ₽/м' }

      solutions: [

        { name: 'Рельсовые демпферы', desc: 'Гасители вибраций на рельсах уменьшают грохот колёс.', red: 5, cost: 300 * 25000, calc: '300 м × 25 тыс. ₽/м' },
        { name: 'Шлифовка рельсов', desc: 'Выравнивание головки рельса убирает основной источник шума качения.', red: 3.5, cost: 300 * 8000, calc: '300 м × 8 тыс. ₽/м' },
        { name: 'Низкие экраны у рельсов', desc: 'Барьер высотой около метра рядом с колёсами, почти не закрывает обзор.', red: 7, cost: 300 * 22000, calc: '300 м × 22 тыс. ₽/м' },
        { name: 'Зелёная стенка на ограждении', desc: 'Озеленённая панель вместо глухого забора.', red: 7, cost: 300 * 85000, calc: '300 м × 85 тыс. ₽/м' }
      ]
    },
    {
      id: 'lenprosp', x: 39.9, y: 41.5, type: 'Магистраль и вокзал',
      name: 'Ленинградский проспект у Белорусского вокзала',
      district: 'Беговой, Тверской район',
      source: 'Постоянный поток в шесть полос, разгон от светофоров, автобусы и такси у вокзала.',
      day: 76, night: 68,
      solutions: [
        { name: 'Малошумный асфальт', desc: 'Пористое покрытие, которое гасит шум шин.', red: 4, cost: 400 * 16 * 1600, calc: '400 м × 16 м × 1,6 тыс. ₽/м²' },
        { name: 'Прозрачный акриловый экран, 3 м', desc: 'Не затемняет окна и витрины первых этажей.', red: 9, cost: 400 * 55000, calc: '400 м × 55 тыс. ₽/м' },
        { name: 'Зелёная шумозащитная стенка', desc: 'Вертикальное озеленение на каркасе с шумопоглощающим наполнителем.', red: 6, cost: 400 * 78000, calc: '400 м × 78 тыс. ₽/м' },
        { name: 'Двухрядная посадка деревьев', desc: 'Полоса деревьев и кустарника вдоль тротуара.', red: 3, cost: 400 * 9000, calc: '400 м × 9 тыс. ₽/м' },
        { name: 'Скорость 40 км/ч и камеры', desc: 'Ограничение скорости и фотофиксация на участке у вокзала.', red: 3, cost: 4 * 600000, calc: '4 камеры × 600 тыс. ₽' }
      ]
    },
    {
      id: 'enthus', x: 72.9, y: 49.1, type: 'Транспортная развязка',
      name: 'Шоссе Энтузиастов и СВХ',
      district: 'Перово, Нижегородский район',
      source: 'Пересечение двух магистралей, много грузовиков, торможение и разгон на съездах.',
      day: 81, night: 74,
      solutions: [
        { name: 'Звукозащитный экран, 5 м', desc: 'Высокие панели вдоль съездов со стороны жилья.', red: 12, cost: 600 * 52000, calc: '600 м × 52 тыс. ₽/м' },
        { name: 'Зелёная шумозащитная стенка', desc: 'Вертикальное озеленение на каркасе с шумопоглощающим наполнителем.', red: 7, cost: 600 * 78000, calc: '600 м × 78 тыс. ₽/м' },
        { name: 'Малошумный асфальт', desc: 'Пористое покрытие, которое гасит шум шин.', red: 4, cost: 600 * 18 * 1600, calc: '600 м × 18 м × 1,6 тыс. ₽/м²' },
        { name: 'Акустическая галерея', desc: 'Полузакрытый навес над частью проезжей части, самый сильный и самый дорогой вариант.', red: 18, cost: 600 * 420000, calc: '600 м × 420 тыс. ₽/м' },
        { name: 'Скорость 60 км/ч и камеры', desc: 'Ограничение скорости и фотофиксация на съездах и на самой развязке.', red: 3, cost: 5 * 560000, calc: '5 камер × 560 тыс. ₽' }
      ]
    },
    {
      id: 'ttk', x: 46.8, y: 70.3, type: 'Стройка',
      name: 'Стройплощадка у ТТК и Ленинского проспекта',
      district: 'Гагаринский район',
      source: 'Работа дизельной техники, компрессоров и генераторов, забивка свай, разгрузка бетона.',
      day: 85, night: 58,
      solutions: [
        { name: 'Временное акустическое ограждение, 4 м', desc: 'Двухслойные мобильные панели по периметру площадки.', red: 12, cost: 250 * 18000, calc: '250 м × 18 тыс. ₽/м' },
        { name: 'Кожухи на компрессоры и генераторы', desc: 'Шумоизолирующие корпуса на самую громкую стационарную технику.', red: 6, cost: 6 * 350000, calc: '6 кожухов × 350 тыс. ₽' },
        { name: 'Электрическая техника вместо дизельной', desc: 'Аренда электрических кранов и погрузчиков на период стройки.', red: 7, cost: 3200000, calc: 'аренда на сезон, 3,2 млн ₽' },
        { name: 'График шумных работ и датчики шума', desc: 'Сваи и отбойники только в согласованные часы, контроль в реальном времени.', red: 3, cost: 8 * 150000, calc: '8 датчиков × 150 тыс. ₽' },
        { name: 'Зелёная стенка на ограждении', desc: 'Озеленённые панели вместо глухого забора.', red: 5, cost: 250 * 78000, calc: '250 м × 78 тыс. ₽/м' }
      ]
    }
  ];

  var nf = function (v, d) { return v.toLocaleString('ru-RU', { maximumFractionDigits: d }); };
  var NB = ' ';
  function sev(db) { return db >= 83 ? 'crit' : db >= 77 ? 'high' : 'mid'; }
  function rub(n) {
    if (n >= 1e6) return nf(n / 1e6, n >= 1e8 ? 0 : 1) + NB + 'млн' + NB + '₽';
    return nf(n / 1e3, 0) + NB + 'тыс.' + NB + '₽';
  }
  function eff(s) { return s.red / (s.cost / 1e6); }
  function ratio(r) { return nf(r, r >= 10 ? 0 : r >= 1 ? 1 : 2); }
  function pct(v) { return ((v - MIN) / (MAX - MIN) * 100).toFixed(2); }

  function scale(base, after, small) {
    var has = after != null;
    var to = has ? after : base;
    var cutW = ((base - to) / (MAX - MIN) * 100).toFixed(2);
    var ticks = small ? '' :
      '<div class="ticks"><span style="left:0;transform:none">40</span>' +
      '<span style="left:var(--norm)">норма 55</span>' +
      '<span style="left:100%;transform:translateX(-100%)">90 дБА</span></div>';
    return '<div class="scale' + (has ? ' is-after' : '') + '" style="--fill:' + pct(to) + '%;--cutL:' + pct(to) +
      '%;--cutW:' + cutW + '%;--norm:' + pct(NORM) + '%">' +
      '<div class="track"><i class="fill"></i>' + (has ? '<i class="cut"></i>' : '') + '<b class="norm"></b></div>' + ticks + '</div>';
  }

  function solCard(s, p, best, second) {
    var after = p.day - s.red;
    var e = eff(s);
    var note = '';
    if (best) {
      note = '<p>' + ratio(e) + NB + 'дБА на 1' + NB + 'млн' + NB + '₽' +
        (second ? ', на ' + Math.round((e / eff(second) - 1) * 100) + '% больше, чем у следующего варианта.' : '.') + '</p>';
    }
    return '<article class="sol' + (best ? ' best' : '') + '">' +
      (best ? '<span class="badge">Лучшее по цене и эффекту</span>' : '') +
      '<h3>' + s.name + '</h3>' +
      '<p>' + s.desc + '</p>' +
      '<dl class="stats">' +
        '<div><dt>Снижение</dt><dd class="good">−' + nf(s.red, 1) + NB + 'дБА</dd></div>' +
        '<div><dt>Стоимость</dt><dd>' + rub(s.cost) + '</dd></div>' +
        '<div><dt>Станет</dt><dd>' + nf(after, 1) + NB + 'дБА</dd></div>' +
      '</dl>' +
      scale(p.day, after, !best) +
      '<div class="calc"><b>' + (best ? 'Расчёт: ' : ratio(e) + NB + 'дБА на 1' + NB + 'млн' + NB + '₽. ') + '</b>' + s.calc + '</div>' +
      (best ? note : '') +
    '</article>';
  }

  var stage = document.getElementById('stage');
  var world = document.getElementById('world');
  var moved = false;
  var panel = document.getElementById('panel');
  var content = document.getElementById('content');
  var barRight = document.getElementById('barRight');
  var current = null;

  POINTS.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pin sev-' + sev(p.day);
    b.style.left = p.x + '%';
    b.style.top = p.y + '%';
    b.style.setProperty('--d', (i * 0.5) + 's');
    b.setAttribute('aria-label', p.name + ', ' + p.day + ' дБА');
    b.setAttribute('aria-pressed', 'false');
    b.dataset.id = p.id;
    b.textContent = p.day;
    b.addEventListener('click', function () { if (moved) return; select(current === p.id ? null : p.id, true); });
    world.appendChild(b);
  });

  /* ---------- Масштаб и перемещение ---------- */
  var Z_MIN = 1, Z_MAX = 4, z = 1, tx = 0, ty = 0;
  var zin = document.getElementById('zin'), zout = document.getElementById('zout'), zreset = document.getElementById('zreset');
  var ptrs = new Map(), lastDist = 0, lastMid = null, startPt = null;

  function apply(strict) {
    var w = stage.clientWidth, h = stage.clientHeight;
    var sx = strict ? 0 : w * 0.12, sy = strict ? 0 : h * 0.12;
    tx = Math.min(sx, Math.max(w * (1 - z) - sx, tx));
    ty = Math.min(sy, Math.max(h * (1 - z) - sy, ty));
    world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
    world.style.setProperty('--z', z);
    stage.classList.toggle('zoomed', z > 1.001);
    zin.disabled = z >= Z_MAX - 0.001;
    zout.disabled = z <= Z_MIN + 0.001;
    zreset.disabled = z <= Z_MIN + 0.001 && Math.abs(tx) < 1 && Math.abs(ty) < 1;
  }
  function zoomAt(cx, cy, nz) {
    nz = Math.min(Z_MAX, Math.max(Z_MIN, nz));
    tx = cx - (cx - tx) * nz / z;
    ty = cy - (cy - ty) * nz / z;
    z = nz;
    apply(true);
  }
  function two() { var a = Array.from(ptrs.values()); return { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), m: { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 } }; }

  zin.addEventListener('click', function () { zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, z * 1.6); });
  zout.addEventListener('click', function () { zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, z / 1.6); });
  zreset.addEventListener('click', function () { z = 1; tx = 0; ty = 0; apply(true); });

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    zoomAt(e.clientX - r.left, e.clientY - r.top, z * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });

  stage.addEventListener('dblclick', function (e) {
    if (e.target.closest('.pin, .zoomCtl')) return;
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, z * 2);
  });

  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.zoomCtl')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    startPt = { x: e.clientX, y: e.clientY };
    moved = false;
    if (ptrs.size === 2) { var t2 = two(); lastDist = t2.d; lastMid = t2.m; moved = true; }
  });
  stage.addEventListener('pointermove', function (e) {
    var p = ptrs.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) {
      var t2 = two(), r = stage.getBoundingClientRect();
      if (lastDist > 0) zoomAt(t2.m.x - r.left, t2.m.y - r.top, z * t2.d / lastDist);
      tx += t2.m.x - lastMid.x; ty += t2.m.y - lastMid.y; apply();
      lastDist = t2.d; lastMid = t2.m;
      return;
    }
    if (ptrs.size === 1 && (e.pointerType === 'mouse' || z > 1.001)) {
      if (!moved) {
        if (Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y) < 5) return;
        moved = true;
        try { stage.setPointerCapture(e.pointerId); } catch (_) {}
        stage.classList.add('dragging');
      }
      tx += dx; ty += dy; apply();
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId);
    stage.classList.remove('dragging');
    lastDist = 0;
    if (ptrs.size === 1) { var q = Array.from(ptrs.values())[0]; startPt = { x: q.x, y: q.y }; moved = true; }
    if (ptrs.size === 0) {
      world.classList.add('settle');
      apply(true);
      setTimeout(function () { world.classList.remove('settle'); }, 260);
    }
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  if (window.ResizeObserver) new ResizeObserver(function () { apply(true); }).observe(stage);
  apply(true);

  function renderEmpty() {
    panel.className = 'panel';
    barRight.innerHTML = '';
    content.innerHTML =
      '<div class="empty">' +
        '<h2>Нажмите на точку, чтобы посмотреть варианты</h2>' +
        '<div class="legend"><span class="lt">Уровень шума днём, дБА</span>' +
        '<ul><li><span class="dot mid"></span>до 76</li><li><span class="dot high"></span>77–82</li><li><span class="dot crit"></span>83 и выше</li></ul></div>' +
      '</div>';
  }

  function renderPoint(p) {
    var sols = p.solutions.slice().sort(function (a, b) { return eff(b) - eff(a); });
    var best = sols[0], second = sols[1];
    var others = sols.slice(1);
    panel.className = 'panel sev-' + sev(p.day);
    barRight.innerHTML = '<button type="button" class="closeBtn" id="closeBtn">Закрыть ×</button>';
    content.innerHTML =
      '<div class="detail">' +
        '<div class="place"><span class="chip">' + p.type + '</span><h2>' + p.name + '</h2><p>' + p.district + '. ' + p.source + '</p></div>' +
        '<div class="level">' +
          '<div class="levelTop">' +
            '<div class="big"><b>' + p.day + '</b><span>дБА днём</span></div>' +
            '<div class="big sm"><b>' + p.night + '</b><span>дБА ночью</span></div>' +
            '<div class="over">+' + (p.day - NORM) + NB + 'дБА к норме</div>' +
          '</div>' +
          scale(p.day, null, false) +
        '</div>' +
        solCard(best, p, true, second) +
        '<h3 class="sectionTitle">Другие варианты</h3>' +
        '<div class="list">' + others.map(function (s) { return solCard(s, p, false); }).join('') + '</div>' +
      '</div>';
    document.getElementById('closeBtn').addEventListener('click', function () { select(null, true); });
  }

  var mq = window.matchMedia('(max-width: 859px)');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function select(id, scroll) {
    current = id;
    var pins = stage.querySelectorAll('.pin');
    for (var i = 0; i < pins.length; i++) pins[i].setAttribute('aria-pressed', String(pins[i].dataset.id === id));
    if (!id) { renderEmpty(); panel.scrollTop = 0; return; }
    var p = POINTS.filter(function (x) { return x.id === id; })[0];
    renderPoint(p);
    panel.scrollTop = 0;
    if (scroll && mq.matches) panel.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current) select(null, false); });
  renderEmpty();
})();
</script>
